<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.H.O.E.N.I.X.</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="js/three.min.js"></script>
</head>
<body>
    <div id="hud-window">
        <!-- 3D Holographic Core Viewport -->
        <div id="canvas-container" title="Click core to wake / sleep | Drag to move | Right click for options">
            <div id="wake-hint" class="core-wake-hint hidden">CLICK TO WAKE</div>
        </div>

        <!-- Floating Holographic Disambiguation & Manual Input Box -->
        <div id="confirmation-card" class="holo-dialog hidden">
            <div class="dialog-prompt" id="dialog-prompt">Did you mean to search:</div>
            <div class="dialog-target" id="dialog-target">ChatGPT</div>
            <div class="dialog-input-wrap">
                <input id="dialog-input" type="text" placeholder="Or type manually..." autocomplete="off" spellcheck="false">
            </div>
            <div class="dialog-actions">
                <button id="btn-dialog-yes" class="holo-btn btn-yes">&#10004; Yes (Enter)</button>
                <button id="btn-dialog-no" class="holo-btn btn-no">&#10006; Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/phoenix_core.js"></script>
    <script src="js/hud_controller.js"></script>
</body>
</html>
